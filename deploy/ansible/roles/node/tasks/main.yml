---
# Follows NodeSource's own setup script exactly (fetched and read before
# writing this, rather than assumed) - they moved to a deb822-format
# .sources file and a binary (not ASCII-armoured) keyring, which a one-line
# `deb [signed-by=...]` entry copied from an older guide would get wrong.

- name: Check whether the right Node major version is already installed
  ansible.builtin.command: node --version
  register: node_version_check
  changed_when: false
  failed_when: false

- name: Node needs (re)installing
  ansible.builtin.set_fact:
    node_needs_install: "{{ node_version_check.rc != 0 or not node_version_check.stdout.startswith('v' ~ node_major ~ '.') }}"

- name: Install NodeSource's prerequisites
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg]
    state: present
  when: node_needs_install

- name: Fetch and dearmour the NodeSource signing key
  ansible.builtin.shell: >
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  args:
    creates: /usr/share/keyrings/nodesource.gpg
  when: node_needs_install

- name: Write the NodeSource apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ node_major }}.x
      Suites: nodistro
      Components: main
      Architectures: {{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      Signed-By: /usr/share/keyrings/nodesource.gpg
  when: node_needs_install
  register: nodesource_source

- name: Update apt cache for the new source
  ansible.builtin.apt:
    update_cache: true
  when: nodesource_source.changed

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
  when: node_needs_install
